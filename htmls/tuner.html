    <!-- Shared language preference and Tuner labels; pitch/frequency data stays LTR. -->
    <script>
      (() => {
        const labels = {
          en: {
            title: "Persian Music Tuner – Microtonal Pitch & Frequency Tool",
            nav: ["Scales", "Tuner", "Guide", "About"],
            auto: "Auto",
            microphone: "Turn on the Microphone",
            language: "Select language",
            autoAria: "Automatic note detection",
            permission: "Microphone access"
          },
          fr: {
            title: "Accordeur de musique persane – Hauteur et fréquence",
            nav: ["Gammes", "Accordeur", "Guide", "À propos"],
            auto: "Auto",
            microphone: "Activer le microphone",
            language: "Choisir la langue",
            autoAria: "Détection automatique des notes",
            permission: "Accès au microphone"
          },
          fa: {
            title: "تیونر موسیقی ایرانی – کوک و فرکانس",
            nav: ["گام‌ها", "تیونر", "راهنما", "درباره"],
            auto: "خودکار",
            microphone: "میکروفون را فعال کنید",
            language: "انتخاب زبان",
            autoAria: "تشخیص خودکار نت",
            permission: "دسترسی به میکروفون"
          }
        };
        const selector = document.getElementById("languageSelector");
        const navLinks = document.querySelectorAll(".bottom-nav a");
        const autoLabel = document.getElementById("tunerAutoLabel");
        function applyLanguage(language) {
          const chosen = labels[language] ? language : "en";
          const copy = labels[chosen];
          selector.value = chosen;
          document.documentElement.lang = chosen;
          // Keep the tuner pitch and frequency readouts in LTR musical order;
          // only translatable UI labels use Persian direction.
          document.documentElement.dir = "ltr";
          document.title = copy.title;
          selector.setAttribute("aria-label", copy.language);
          autoLabel.textContent = copy.auto;
          autoLabel.dir = chosen === "fa" ? "rtl" : "ltr";
          document.querySelector(".auto input").setAttribute("aria-label", copy.autoAria);
          navLinks.forEach((link, index) => {
            link.querySelector("span").textContent = copy.nav[index];
            const url = new URL(link.getAttribute("href"), location.href);
            url.searchParams.set("lang", chosen);
            link.href = url.href;
          });
          try { localStorage.setItem("persianMusicScalesLanguage", chosen); } catch (_) {}
        }

        window.getTunerTranslation = key => {
          const chosen = labels[selector.value] ? selector.value : "en";
          return labels[chosen][key] || labels.en[key] || key;
        };
        selector.addEventListener("change", () => applyLanguage(selector.value));
        let stored = "";
        try { stored = localStorage.getItem("persianMusicScalesLanguage") || ""; } catch (_) {}
        const requested = new URLSearchParams(location.search).get("lang");
        const browser = (navigator.language || "en").slice(0, 2).toLowerCase();
        applyLanguage(labels[requested] ? requested : labels[stored] ? stored : labels[browser] ? browser : "en");
      })();
    </script>
